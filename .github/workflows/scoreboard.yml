name: Weekly scoreboard

on:
  schedule:
    - cron: '0 8 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-scoreboard-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependency
        run: python -m pip install -r requirements.txt
      - name: Research and validate scoreboard
        id: scoreboard
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/update_scoreboard.py --pr-body "$RUNNER_TEMP/scoreboard-pr.md" --github-output "$GITHUB_OUTPUT"
      - name: Build site
        run: python scripts/build.py
      - name: Check for content changes
        id: changes
        run: |
          if git diff --quiet -- content/settings/weekly.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Open scoreboard pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/scoreboard-${{ github.run_id }}
          delete-branch: true
          commit-message: ${{ steps.scoreboard.outputs.pr_title }}
          title: ${{ steps.scoreboard.outputs.pr_title }}
          body-path: ${{ runner.temp }}/scoreboard-pr.md
          add-paths: content/settings/weekly.json
